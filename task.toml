schema_version = "1.3"

[task]
name = "local/seismic-array-recovery"
description = "Recover six unlabeled seismic receivers, zero-mean clock offsets, and two nonuniform slowness parameters from an 8-event differential system."
authors = [{ name = "batch-d" }]
keywords = ["earth-science", "seismology", "clock-offsets", "assignment", "slowness"]

[agent]
timeout_sec = 3600
user = "worker"

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
workdir = "/app"

[verifier]
timeout_sec = 120
user = "worker"

[metadata]
difficulty = "expert"
category = "earth-science"
tags = ["seismology", "least-squares", "bipartite-matching", "clock-normalization"]
expert_time_estimate = "45m"
